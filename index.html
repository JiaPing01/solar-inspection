/* =====================================================
   Global Loading Overlay
   ===================================================== */
#loadingOverlay {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: rgba(245, 246, 248, .88);
  -webkit-backdrop-filter: blur(5px);
  backdrop-filter: blur(5px);
  opacity: 1;
  visibility: visible;
  transition: opacity .18s ease, visibility .18s ease;
}
#loadingOverlay.is-hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.loading-panel {
  width: min(100%, 300px);
  padding: 28px 22px;
  border-radius: 20px;
  background: #fff;
  box-shadow: 0 8px 30px rgba(0,0,0,.12);
  text-align: center;
}
.loading-spinner {
  width: 54px;
  height: 54px;
  margin: 0 auto 18px;
  border: 5px solid #e5e7eb;
  border-top-color: #222;
  border-right-color: #555;
  border-radius: 50%;
  animation: loading-spin .78s linear infinite;
}
.loading-title {
  font-size: 18px;
  font-weight: 700;
  color: #202124;
}
.loading-message {
  margin-top: 7px;
  color: #777;
  font-size: 14px;
  line-height: 1.55;
}
.loading-dots::after {
  content: '';
  display: inline-block;
  width: 1.4em;
  text-align: left;
  animation: loading-dots 1.25s steps(4, end) infinite;
}
@keyframes loading-spin {
  to { transform: rotate(360deg); }
}
@keyframes loading-dots {
  0% { content: ''; }
  25% { content: '.'; }
  50% { content: '..'; }
  75%, 100% { content: '...'; }
}
@media (prefers-reduced-motion: reduce) {
  .loading-spinner, .loading-dots::after { animation-duration: 2.5s; }
  #loadingOverlay { transition: none; }
}

<body>
<div id="app"></div>
<!-- 頁面初始載入遮罩：即使 API 尚未回應，也會先顯示動畫 -->
<div id="loadingOverlay" role="status" aria-live="polite" aria-atomic="true">
  <div class="loading-panel">
    <div class="loading-spinner" aria-hidden="true"></div>
    <div class="loading-title">太陽能系統巡檢</div>
    <div id="loadingMessage" class="loading-message">正在連線並載入巡檢資料<span class="loading-dots"></span></div>
  </div>
</div>
<div id="bottomNav"
class="bottom-nav"
style="display:none">
<button class="nav-btn"
onclick="showHome()">
<span class="nav-icon">⌂</span>
首頁
</button>
<button class="nav-btn"
onclick="showPoints()">
<span class="nav-icon">✓</span>
檢核
</button>
<button class="nav-btn"
onclick="showHistory()">
<span class="nav-icon">☷</span>
記錄
</button>
</div>
<script>
let inspectors = [];
let points = [];
let dashboard = [];
let todayInspections = [];
let currentInspector = null;
let currentPoint = null;
let checklist = [];
let results = {};
let currentMethod = '';
let openIssues = [];
let issueReviews = {};
let currentPhoto = null;
/* =====================================================
   Scanner State
   ===================================================== */
let nfcReader = null;
let nfcAbortController = null;
let qrStream = null;
let qrDetector = null;
let qrScannerRunning = false;
let qrAnimationFrame = null;
let useNativeBarcodeDetector = false;
/* =====================================================
   Global Loading State
   ===================================================== */
let loadingCount = 0;
let initialLoading = true;
let loadingMessageText = '正在載入資料';
function renderLoadingState() {
  const overlay = document.getElementById('loadingOverlay');
  const message = document.getElementById('loadingMessage');
  if (!overlay) return;
  if (message) {
    message.innerHTML = `${esc(loadingMessageText)}<span class="loading-dots"></span>`;
  }
  const shouldShow = initialLoading || loadingCount > 0;
  overlay.classList.toggle('is-hidden', !shouldShow);
  overlay.setAttribute('aria-hidden', shouldShow ? 'false' : 'true');
}
function showLoading(message = '正在載入資料') {
  loadingCount++;
  loadingMessageText = message;
  renderLoadingState();
}
function hideLoading() {
  loadingCount = Math.max(0, loadingCount - 1);
  renderLoadingState();
}
function finishInitialLoading() {
  initialLoading = false;
  renderLoadingState();
}

/* =====================================================
   Server
   ===================================================== */
const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbySwcWW5i0s9LJOJWSah51PNDZ7fzGTh_qvxZPk3jks3uT_FgHjVP1BVLSufqalRkQDbg/exec';
async function runServer(name, ...args) {
  showLoading('正在與巡檢系統連線');
  try {
    let response;
    try {
      response = await fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: name, args })
      });
    } catch (error) {
      throw new Error(
        '無法連線到巡檢 API。若開發者工具顯示 CORS，代表 Apps Script 不允許 GitHub Pages 讀取回應；這不是帳號或相機權限問題。原始錯誤：' + (error?.message || error)
      );
    }
    if (!response.ok) {
      throw new Error('巡檢 API 回應 HTTP ' + response.status);
    }
    let payload;
    try {
      payload = await response.json();
    } catch (error) {
      throw new Error('API 回應不是有效 JSON，請確認 Apps Script 部署版本。');
    }
    if (!payload.success) {
      throw new Error(payload.error || '巡檢 API 執行失敗');
    }
    return payload.data;
  } finally {
    hideLoading();
  }
}
/* =====================================================
   Init
   ===================================================== */
async function init() {
  try {
    await runServer('setupSystem');
    const data =
      await Promise.all([
        runServer('getInspectors'),
        runServer('getPoints'),
        runServer('getDashboardData'),
        runServer('getTodayInspections')
      ]);
    inspectors = data[0];
    points = data[1];
    dashboard = data[2];
    todayInspections = data[3];
    const saved =
      sessionStorage.getItem(
        'currentInspector'
      );
    if (saved) {
      try {
        const user =
          JSON.parse(saved);
        currentInspector =
          inspectors.find(
            x =>
              String(x.inspectorID) ===
              String(user.inspectorID)
          );
      } catch (e) {
        currentInspector = null;
      }
    }
    if (currentInspector) {
      showApp();
    } else {
      showInspectorSelection();
    }
  } catch (error) {
    showError(error);
  }
}
/* =====================================================
   Inspector
   ===================================================== */
function showInspectorSelection() {
  bottom(false);
  let html = `
  <div class="page user-page">
    <div class="user-title">
      誰要進行巡檢？
    </div>
    <div class="user-subtitle">
      請選擇本次簽核者
    </div>
  `;
  inspectors.forEach(user => {
    html += `
    <button
      class="user-card"
      onclick="selectInspector('${escJS(user.inspectorID)}')">
      <div class="avatar">
        ${
          user.avatar
          ? `<img src="${esc(user.avatar)}">`
          : '👤'
        }
      </div>
      <div>
        <div class="user-name">
          ${esc(user.name)}
        </div>
        <div class="user-permission">
          ${esc(user.permission || 'Inspector')}
        </div>
      </div>
    </button>
    `;
  });
  if (!inspectors.length) {
    html += `
    <div class="card">
      尚未建立任何啟用中的簽核者。
    </div>
    `;
  }
  html += `</div>`;
  app(html);
}
function selectInspector(id) {
  currentInspector =
    inspectors.find(
      x =>

async function beginScan(method) {
  currentMethod = method;
  stopAllScanning();
  showLoading(method === 'NFC' ? '正在啟動 NFC 掃描' : '正在啟動相機與 QR 掃描器');

    }

      return;
    }
  } finally {

/* =====================================================
   NFC
   ===================================================== */
async function startNFCScan() {
  if (!('NDEFReader' in window)) {
    showScannerError(
      '此瀏覽器不支援 Web NFC。請使用 Android Chrome，或改用 QR Code。'
    );
    return;
  }
  app(`
  <div class="page scanner-page">
    <button
      class="back-btn"
      onclick="showScanChoice()">
      ← 返回
    </button>
    <div class="scanner-title">
      NFC 掃描
    </div>
    <div class="scanner-description">
      請將手機靠近巡檢點 NFC Tag
    </div>
    <div
      class="card"
      style="text-align:center;padding:32px 18px">
      <div style="font-size:70px">
        📳
      </div>
      <div
        style="font-size:18px;font-weight:700;margin-top:15px">
        等待 NFC Tag
      </div>
      <div
        id="scanner-status"
        class="scanner-status"
        style="margin-top:8px">
        正在啟動 NFC……
      </div>
    </div>
    <button
      class="secondary-btn"
      onclick="stopNFCScan();showScanChoice()">
      取消掃描
    </button>
  </div>
  `);
  try {
    nfcReader =
      new NDEFReader();
    nfcAbortController =
      new AbortController();
    nfcReader.onreadingerror = () => {
      const el = document.getElementById('scanner-status');
      if (el) el.textContent = '無法讀取此 NFC Tag，請重新靠近';
    };
    nfcReader.onreading = event => handleNFCReading(event);
    await nfcReader.scan({
      signal: nfcAbortController.signal
    });
    const status =
      document.getElementById(
        'scanner-status'
      );
    if (status) {
      status.textContent =
        'NFC 已啟動，請靠近 Tag';
    }
  } catch (error) {
    if (
      error.name ===
      'AbortError'
    ) {
      return;
    }
    showScannerError(
      'NFC 啟動失敗：' +
      (error.message || error)
    );
  }
}
function handleNFCReading(event) {
  let pointID = null;
  try {
    for (
      const record
      of event.message.records
    ) {
      const text =
        decodeNFCRecord(record);
      if (!text)
        continue;
      pointID =
        parsePointPayload(text);
      if (pointID)
        break;
    }
  } catch (error) {
    showScannerError(
      'NFC 資料解析失敗：' +
      error.message
    );
    return;
  }
  if (!pointID) {
    showScannerError(
      '這個 NFC Tag 不是本巡檢系統的點位 Tag。'
    );
    return;
  }
  stopNFCScan();
  openScannedPoint(
    pointID,
    'NFC'
  );
}
function decodeNFCRecord(record) {
  try {
    if (
      record.recordType ===
      'text'
    ) {
      return new TextDecoder(
        record.encoding ||
        'utf-8'
      ).decode(
        record.data
      ).trim();
    }
    if (
      record.recordType ===
      'url'
    ) {
      return new TextDecoder()
        .decode(record.data)
        .trim();
    }
    if (
      record.recordType ===
      'mime' ||
      record.recordType ===
      'unknown'
    ) {
      return new TextDecoder()
        .decode(record.data)
        .trim();
    }
  } catch (error) {
    return '';
  }
  return '';
}
/* =====================================================
   QR (雙軌雙層相容版：Android 原生 + iOS jsQR)
   ===================================================== */
async function startQRScan() {
  useNativeBarcodeDetector = false;

  // 1. 優先檢測原生 BarcodeDetector (例如 Android Chrome)
  if ('BarcodeDetector' in window) {
    try {
      const formats = await BarcodeDetector.getSupportedFormats();
      if (formats.includes('qr_code')) {
        useNativeBarcodeDetector = true;
        qrDetector = new BarcodeDetector({ formats: ['qr_code'] });
      }
    } catch (error) {
      useNativeBarcodeDetector = false;
    }
  }

  // 渲染相機介面，包含 iOS 專用必要屬性與 jsQR 抽幀用的 hidden canvas
  app(`
  <div class="page scanner-page">
    <button
      class="back-btn"
      onclick="stopQRScan();showScanChoice()">
      ← 返回
    </button>
    <div class="scanner-title">
      QR Code 掃描
    </div>
    <div class="scanner-description">
      將巡檢點 QR Code 放入框線內
    </div>
    <div class="scanner-box">
      <video
        id="qr-video"
        autoplay
        playsinline
        muted>
      </video>
      <div class="scanner-frame"></div>
    </div>
    <div
      id="scanner-status"
      class="scanner-status">
      正在啟動相機……
    </div>
    <button
      class="secondary-btn"
      onclick="stopQRScan();showScanChoice()">
      取消掃描
    </button>
    <canvas id="qr-canvas" style="display:none;"></canvas>
  </div>
  `);

  try {
    qrStream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: {
          ideal: 'environment'
        }
      },
      audio: false
    });
    const video = document.getElementById('qr-video');
    if (!video) return;

    video.srcObject = qrStream;
    // 強制加上 playsinline 屬性，防範部分舊版 iOS Safari 播放攔截
    video.setAttribute("playsinline", "true");
    await video.play();

    qrScannerRunning = true;
    const status = document.getElementById('scanner-status');
    if (status) {
      status.textContent = '相機已啟動，請對準 QR Code';
    }
    scanQRFrame();
  } catch (error) {
    showScannerError(
      '相機啟動失敗：' +
      (error.message || error) +
      '\n\n請確認已允許此網站使用相機。'
    );
  }
}

async function scanQRFrame() {
  if (!qrScannerRunning) return;

  const video = document.getElementById('qr-video');
  const canvasElement = document.getElementById('qr-canvas');

  if (
    !video ||
    video.readyState < HTMLMediaElement.HAVE_ENOUGH_DATA
  ) {
    qrAnimationFrame = requestAnimationFrame(scanQRFrame);
    return;
  }

  let rawData = null;

  try {
    if (useNativeBarcodeDetector && qrDetector) {
      // 軌道 A：使用原生 BarcodeDetector 進行高效率解析
      const codes = await qrDetector.detect(video);
      if (codes.length) {
        rawData = codes[0].rawValue;
      }
    } else if (typeof jsQR !== 'undefined' && canvasElement) {
      // 軌道 B：使用 jsQR 畫布進行圖像降級解析 (iOS Safari)
      const canvasContext = canvasElement.getContext('2d', { willReadFrequently: true });
      canvasElement.height = video.videoHeight;
      canvasElement.width = video.videoWidth;
      canvasContext.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);
      const imageData = canvasContext.getImageData(0, 0, canvasElement.width, canvasElement.height);
      
      const code = jsQR(imageData.data, imageData.width, imageData.height, {
        inversionAttempts: "dontInvert"
      });
      if (code) {
        rawData = code.data;
      }
    }
  } catch (error) {
    /* 單次讀取失敗不中斷即時掃描迴圈 */
  }

  if (rawData) {
    // 呼叫原本完全保留的 parsePointPayload 驗證邏輯
    const pointID = parsePointPayload(rawData);
    if (pointID) {
      stopQRScan();
      openScannedPoint(pointID, 'QR');
      return;
    }
  }

  if (qrScannerRunning) {
    qrAnimationFrame = requestAnimationFrame(scanQRFrame);
  }
}
/* =====================================================
   Payload Parser
   ===================================================== */
/*
 * NFC / QR 建議寫入：
 *
 * PVINSPECT:P01
 *
 * 也接受：
 *
 * P01
 *
 * 或：
 *
 * https://你的網址...?point=P01
 *
 * 方便未來擴充。
 */
function parsePointPayload(payload) {
  if (!payload)
    return null;
  const text =
    String(payload).trim();
  /*
   * 標準格式：
   *
   * PVINSPECT:P01
   */
  const prefixMatch =
    text.match(
      /^PVINSPECT:([A-Za-z0-9_-]+)$/i
    );
  if (prefixMatch) {
    return findPointID(
      prefixMatch[1]
    );
  }
  /*
   * 直接寫 P01
   */
  if (
    /^[A-Za-z0-9_-]+$/.test(text)
  ) {
    const point =
      findPointID(text);
    if (point)
      return point;
  }
  /*
   * 未來如果 QR / NFC 寫成 Web App URL
   */
  try {
    const url =
      new URL(text);
    const pointID =
      url.searchParams.get(
        'point'
      );
    if (pointID) {
      return findPointID(
        pointID
      );
    }
  } catch (error) {
    /* 不是 URL，忽略 */
  }
  return null;
}
function findPointID(value) {
  const point =
    points.find(
      p =>
        String(p.pointID)
          .toUpperCase() ===
        String(value)
          .toUpperCase()
    );
  return point
    ? point.pointID
    : null;
}

   Open Scanned Point
   ===================================================== */
function openScannedPoint(
  pointID,
  method
) {
  const point =
    points.find(
      p =>
        String(p.pointID) ===
        String(pointID)
    );
  if (!point) {
    showScannerError(
      '無法辨識 PointID：' +
      pointID
    );
    return;
  }
  currentPoint = point;
  currentMethod = method;
  loadPointData();
}
/* =====================================================
   Scanner Stop
   ===================================================== */
function stopNFCScan() {
  if (nfcAbortController) {
    try {
      nfcAbortController.abort();
    } catch (e) {}
  }
  nfcAbortController = null;
  nfcReader = null;
}
function stopQRScan() {
  qrScannerRunning = false;
  qrDetector = null;
  useNativeBarcodeDetector = false;
  if (qrAnimationFrame) {
    cancelAnimationFrame(
      qrAnimationFrame
    );
    qrAnimationFrame = null;
  }
  if (qrStream) {
    qrStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );
    qrStream = null;
  }
}
function stopAllScanning() {
  stopNFCScan();
  stopQRScan();
}

/* =====================================================

   ===================================================== */
function setResult(itemID, result) {
  results[itemID] = {
    result,
    note: '',
    reviewed: false
  };
  ['ok', 'attention', 'ng']
    .forEach(type => {
      const el =
        document.getElementById(
          `${type}-${itemID}`
        );
      if (el)
        el.className =
          'result-btn';
    });
  if (result === 'OK') {
    document
      .getElementById(
        `ok-${itemID}`
      )
      .className +=
        ' selected-ok';
  }
  if (result === '注意') {
    document
      .getElementById(
        `attention-${itemID}`
      )
      .className +=
        ' selected-attention';
  }
  if (result === 'NG') {
    document
      .getElementById(
        `ng-${itemID}`
      )
      .className +=
        ' selected-ng';
  }
  const box =
    document.getElementById(
      `note-${itemID}`
    );
  if (result === 'OK') {
    box.innerHTML = '';
  } else {
    box.innerHTML = `
      <textarea
        id="note-input-${esc(itemID)}"
        class="note-box"
        placeholder="請填寫異常狀況或備註"></textarea>
    `;
  }
}
function setIssueReview(
  issueID,
  result
) {
  if (!result) {
    delete issueReviews[issueID];
    return;
  }
  issueReviews[issueID] = {
    issueID,
    result,
    close: false,
    note: ''
  };
}

  const file =

/* =====================================================
   Submit
   ===================================================== */
async function submitInspection() {
  const incomplete =
    checklist.filter(
      item =>
        !results[item.itemID]
    );
  if (incomplete.length) {
    alert(
      `還有 ${incomplete.length} 個項目尚未判定。`
    );
    return;
  }
  for (const item of checklist) {
    const r =
      results[item.itemID];
    if (
      r.result === '注意' ||
      r.result === 'NG'
    ) {
      const note =
        document.getElementById(
          `note-input-${item.itemID}`
        );
      if (
        !note ||
        !note.value.trim()
      ) {
        alert(
          `「${item.item}」需要填寫備註。`
        );
        note?.focus();
        return;
      }
      r.note =
        note.value.trim();
      r.itemText =
        item.item;
    }
  }
  const type =
    document.getElementById(
      'inspection-type'
    ).value;
  let additionalReason = '';
  if (type === '追加') {
    additionalReason =
      document
        .getElementById(
          'additional-reason'
        )
        .value
        .trim();
    if (!additionalReason) {
      alert(
        '追加檢查必須填寫原因。'
      );
      return;
    }
  }
  Object.keys(issueReviews)
    .forEach(issueID => {
      const input =
        document.getElementById(
          `review-note-${issueID}`
        );
      if (input) {
        issueReviews[issueID].note =
          input.value.trim();
      }
    });
  const measurements = {
    pvVoltage:
      document.getElementById(
        'm-pv'
      ).value,
    diodeVoltage:
      document.getElementById(
        'm-diode'
      ).value,
    bypassVoltage:
      document.getElementById(
        'm-bypass'
      ).value,
    loadCurrent:
      document.getElementById(
        'm-current'
      ).value,
    outputPower:
      document.getElementById(
        'm-power'
      ).value,
    controllerTemp:
      document.getElementById(
        'm-temp'
      ).value,
    weather:
      document.getElementById(
        'm-weather'
      ).value
  };
  let photo = null;
  if (currentPhoto) {
    photo =
      await fileToBase64(
        currentPhoto
      );
  }
  const btn =
    document.getElementById(
      'submit-btn'
    );
  btn.disabled = true;
  btn.textContent =
    '正在儲存……';
  try {
    await runServer(
      'saveInspection',
      {
        inspectorName:
          currentInspector.name,
        inspectorID:
          currentInspector.inspectorID,
        pointID:
          currentPoint.pointID,
        method:
          currentMethod,
        inspectionType:
          type,
        additionalReason,
        results:
          checklist.map(item => ({
            itemID:
              item.itemID,
            itemText:
              item.item,
            result:
              results[item.itemID]
                .result,
            note:
              results[item.itemID]
                .note || '',
            reviewed:
              false
          })),
        issueReviews:
          Object.values(
            issueReviews
          ),
        measurements,
        photo
      }
    );
    todayInspections =
      await runServer(
        'getTodayInspections'
      );
    dashboard =
      await runServer(
        'getDashboardData'
      );
    showComplete();
  } catch (error) {
    btn.disabled = false;
    btn.textContent =
      '完成此次檢查';
    alert(
      '儲存失敗：\n' +
      error.message
    );
  }
}

/* =====================================================
   File
   ===================================================== */
function fileToBase64(file) {
  return new Promise(
    (resolve, reject) => {
      const reader =
        new FileReader();
      reader.onload = () => {
        const result =
          reader.result;
        const comma =
          result.indexOf(',');
        resolve({
          name:
            file.name,
          mimeType:
            file.type,
          data:
            result.substring(
              comma + 1
            )
        });
      };
      reader.onerror =
        reject;
      reader.readAsDataURL(
        file
      );
    }
  );
}

function app(html) {

function bottom(show) {

      'bottomNav'

function esc(value) {
  if (
    value === null ||
    value === undefined
  )
    return '';
  return String(value)
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );
}
function escJS(value) {
  return String(value)
    .replace(
      /\\/g,
      '\\\\'
    )
    .replace(
      /'/g,
      "\\'"
    )
    .replace(
      /"/g,
      '\\"'
    );
}

/* =====================================================
   Legacy URL Scan Compatibility
   ===================================================== */
/*
 * 保留舊版 URL 入口相容性。
 *
 * 例如：
 *
 * ?point=P01&method=NFC
 *
 * 未來如果你真的需要把 NFC / QR
 * 寫成網址，仍然可以使用。
 *
 * 但現在的主要 NFC / QR 流程
 * 已經改成「App 主動掃描」。
 */
function checkScanURL() {
  const params =
    new URLSearchParams(
      window.location.search
    );
  const pointID =
    params.get('point');
  const method =
    params.get('method');
  if (
    !pointID ||
    !method
  )
    return;
  window.pendingScan = {
    pointID,
    method
  };
}
/* =====================================================
   Init with URL Compatibility
   ===================================================== */
const originalInit = init;
init = async function() {
  checkScanURL();
  try {
    await originalInit();
    if (
      window.pendingScan &&
      currentInspector
    ) {
      openScannedPoint(
        window.pendingScan.pointID,
        window.pendingScan.method
      );
      window.pendingScan = null;
    }
  } finally {
    finishInitialLoading();
  }
};
init();
