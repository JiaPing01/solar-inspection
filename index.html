<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>太陽能系統巡檢</title>
<!-- 引入 jsQR 作為 iOS 與不支援原生 API 瀏覽器的備用方案 -->
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<style>
* {
  box-sizing: border-box;
}
html {
  width: 100%;
  min-height: 100%;
  -webkit-text-size-adjust: 100%;
}
body {
  margin: 0;
  width: 100%;
  min-height: 100vh;
  background: #f5f6f8;
  color: #202124;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
  font-size: 16px;
  line-height: 1.5;
  padding-bottom: calc(76px + env(safe-area-inset-bottom));
}
button,
input,
textarea,
select {
  font-family: inherit;
  font-size: 16px;
}
button {
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
button:disabled {
  opacity: .55;
  cursor: default;
}
input,
textarea,
select {
  -webkit-appearance: none;
  appearance: none;
}
/* =====================================================
   App Layout
   ===================================================== */
#app {
  width: 100%;
  min-height: 100vh;
}
.page {
  width: 100%;
  max-width: 480px;
  min-height: calc(100vh - 76px);
  margin: 0 auto;
  padding: 16px;
}
/* =====================================================
   Typography
   ===================================================== */
.title {
  font-size: 24px;
  font-weight: 700;
  line-height: 1.25;
  margin-bottom: 6px;
}
.subtitle {
  color: #777;
  font-size: 15px;
  margin-bottom: 20px;
}
.section-title {
  font-size: 19px;
  font-weight: 700;
  margin: 24px 0 12px;
}
.card {
  background: #fff;
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.05);
}
/* =====================================================
   Buttons
   ===================================================== */
.primary-btn {
  width: 100%;
  min-height: 50px;
  border: 0;
  border-radius: 14px;
  padding: 13px 16px;
  background: #222;
  color: #fff;
  font-size: 16px;
  font-weight: 600;
}
.secondary-btn {
  width: 100%;
  min-height: 48px;
  border: 0;
  border-radius: 14px;
  padding: 12px 16px;
  background: #e9eaec;
  font-size: 16px;
}
.back-btn {
  min-height: 44px;
  border: 0;
  background: none;
  padding: 4px 0;
  margin-bottom: 12px;
  color: #555;
  font-size: 16px;
}
/* =====================================================
   User Selection
   ===================================================== */
.user-page {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding-top: 32px;
  padding-bottom: 32px;
}
.user-title {
  text-align: center;
  font-size: 27px;
  font-weight: 700;
}
.user-subtitle {
  text-align: center;
  color: #777;
  margin: 8px 0 24px;
}
.user-card {
  width: 100%;
  min-height: 82px;
  border: 0;
  background: #fff;
  border-radius: 18px;
  padding: 16px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 15px;
  text-align: left;
  box-shadow: 0 2px 8px rgba(0,0,0,.05);
}
.avatar {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: #e8e8e8;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  flex-shrink: 0;
}
.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.user-name {
  font-size: 18px;
  font-weight: 600;
}
.user-permission {
  color: #888;
  font-size: 13px;
  margin-top: 3px;
}
/* =====================================================
   Header
   ===================================================== */
.user-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  min-height: 44px;
  margin-bottom: 16px;
}
.current-user {
  display: flex;
  align-items: center;
  gap: 10px;
}
.small-avatar {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  overflow: hidden;
  background: #ddd;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-shrink: 0;
}
.small-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.current-user-name {
  font-size: 15px;
  font-weight: 600;
}
.switch-user {
  min-height: 40px;
  border: 0;
  background: none;
  padding: 8px;
  color: #777;
  font-size: 15px;
}
/* =====================================================
   Progress
   ===================================================== */
.progress-card {
  background: #222;
  color: white;
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 16px;
}
.progress-label {
  opacity: .7;
  font-size: 14px;
}
.progress-number {
  font-size: 36px;
  font-weight: 700;
  margin: 4px 0;
}
.progress-bar {
  height: 8px;
  background: #555;
  border-radius: 10px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: white;
  transition: .3s;
}
/* =====================================================
   Home Menu
   ===================================================== */
.menu-card {
  width: 100%;
  min-height: 76px;
  border: 0;
  background: white;
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 12px;
  display: flex;
  gap: 15px;
  align-items: center;
  text-align: left;
  box-shadow: 0 2px 8px rgba(0,0,0,.04);
}
.menu-icon {
  font-size: 27px;
  width: 42px;
  text-align: center;
  flex-shrink: 0;
}
.menu-title {
  font-size: 17px;
  font-weight: 600;
}
.menu-description {
  color: #888;
  font-size: 14px;
  margin-top: 3px;
}
/* =====================================================
   Point
   ===================================================== */
.point-card {
  background: white;
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.04);
}
.point-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
}
.point-name {
  font-size: 18px;
  font-weight: 700;
}
.point-id {
  color: #888;
  font-size: 13px;
  margin-top: 3px;
}
.point-location {
  color: #777;
  font-size: 14px;
  margin-top: 8px;
}
.point-last {
  margin-top: 10px;
  font-size: 13px;
  color: #666;
}
.status {
  padding: 5px 9px;
  border-radius: 20px;
  font-size: 12px;
  white-space: nowrap;
  height: max-content;
}
.status-normal {
  background: #e2f3e7;
  color: #176b35;
}
.status-today {
  background: #fff0b8;
  color: #745700;
}
.status-overdue {
  background: #ffe1e1;
  color: #a51d16;
}
.status-never {
  background: #ffe1e1;
  color: #a51d16;
}
.status-done {
  background: #dff5e5;
  color: #176b35;
}
.point-button {
  width: 100%;
  min-height: 48px;
  margin-top: 14px;
  padding: 11px;
  border: 0;
  border-radius: 12px;
  background: #222;
  color: white;
  font-size: 16px;
  font-weight: 600;
}
/* =====================================================
   Scan
   ===================================================== */
.scan-title {
  text-align: center;
  margin-top: 16px;
}
.scan-point {
  font-size: 19px;
  font-weight: 700;
  margin: 10px 0 24px;
}
.scan-option {
  width: 100%;
  min-height: 150px;
  border: 0;
  background: white;
  border-radius: 18px;
  padding: 24px 18px;
  margin-bottom: 14px;
  text-align: center;
  box-shadow: 0 2px 8px rgba(0,0,0,.05);
}
.scan-icon {
  font-size: 44px;
  line-height: 1;
  margin-bottom: 12px;
}
.scan-option-title {
  font-size: 19px;
  font-weight: 700;
}
.scan-option-description {
  color: #888;
  font-size: 14px;
  margin-top: 6px;
}
/* =====================================================
   Scanner
   ===================================================== */
.scanner-page {
  text-align: center;
}
.scanner-title {
  font-size: 23px;
  font-weight: 700;
  margin-top: 8px;
}
.scanner-description {
  color: #777;
  margin-top: 6px;
  margin-bottom: 18px;
}
.scanner-box {
  width: 100%;
  aspect-ratio: 1 / 1;
  background: #111;
  border-radius: 20px;
  overflow: hidden;
  position: relative;
  margin-bottom: 16px;
}
#qr-video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.scanner-frame {
  position: absolute;
  left: 15%;
  right: 15%;
  top: 15%;
  bottom: 15%;
  border: 3px solid white;
  border-radius: 18px;
  pointer-events: none;
  box-shadow: 0 0 0 999px rgba(0,0,0,.20);
}
.scanner-status {
  min-height: 25px;
  color: #666;
  margin-bottom: 12px;
}
.scanner-error {
  color: #a51d16;
}
/* =====================================================
   Bottom Navigation
   ===================================================== */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  min-height: 68px;
  padding-bottom: env(safe-area-inset-bottom);
  background: rgba(255,255,255,.97);
  border-top: 1px solid #ddd;
  display: flex;
  justify-content: space-around;
  align-items: center;
