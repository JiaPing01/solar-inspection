<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>太陽能系統巡檢</title>
<!-- 引入 jsQR 庫，解決 iOS Safari 不支援 BarcodeDetector 的問題 -->
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<style>
* {
  box-sizing: border-box;
}
html {
  width: 100%;
  min-height: 100%;
  -webkit-text-size-adjust: 100%;
}
body {
  margin: 0;
  width: 100%;
  min-height: 100vh;
  background: #f5f6f8;
  color: #202124;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
  font-size: 16px;
  line-height: 1.5;
  padding-bottom: calc(76px + env(safe-area-inset-bottom));
}
button,
input,
textarea,
select {
  font-family: inherit;
  font-size: 16px;
}
button {
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
button:disabled {
  opacity: .55;
  cursor: default;
}
input,
textarea,
select {
  -webkit-appearance: none;
  appearance: none;
}
/* =====================================================
   App Layout
   ===================================================== */
#app {
  width: 100%;
  min-height: 100vh;
}
.page {
  width: 100%;
  max-width: 480px;
  min-height: calc(100vh - 76px);
  margin: 0 auto;
  padding: 16px;
}
/* =====================================================
   Typography
   ===================================================== */
.title {
  font-size: 24px;
  font-weight: 700;
  line-height: 1.25;
  margin-bottom: 6px;
}
.subtitle {
  color: #777;
  font-size: 15px;
  margin-bottom: 20px;
}
.section-title {
  font-size: 19px;
  font-weight: 700;
  margin: 24px 0 12px;
}
.card {
  background: #fff;
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.05);
}
/* =====================================================
   Buttons
   ===================================================== */
.primary-btn {
  width: 100%;
  min-height: 50px;
  border: 0;
  border-radius: 14px;
  padding: 13px 16px;
  background: #222;
  color: #fff;
  font-size: 16px;
  font-weight: 600;
}
.secondary-btn {
  width: 100%;
  min-height: 48px;
  border: 0;
  border-radius: 14px;
  padding: 12px 16px;
  background: #e9eaec;
  font-size: 16px;
}
.back-btn {
  min-height: 44px;
  border: 0;
  background: none;
  padding: 4px 0;
  margin-bottom: 12px;
  color: #555;
  font-size: 16px;
}
/* =====================================================
   User Selection
   ===================================================== */
.user-page {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding-top: 32px;
  padding-bottom: 32px;
}
.user-title {
  text-align: center;
  font-size: 27px;
  font-weight: 700;
}
.user-subtitle {
  text-align: center;
  color: #777;
  margin: 8px 0 24px;
}
.user-card {
  width: 100%;
  min-height: 82px;
  border: 0;
  background: #fff;
  border-radius: 18px;
  padding: 16px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 15px;
  text-align: left;
  box-shadow: 0 2px 8px rgba(0,0,0,.05);
}
.avatar {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: #e8e8e8;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  flex-shrink: 0;
}
.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.user-name {
  font-size: 18px;
  font-weight: 600;
}
.user-permission {
  color: #888;
  font-size: 13px;
  margin-top: 3px;
}
/* =====================================================
   Header
   ===================================================== */
.user-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  min-height: 44px;
  margin-bottom: 16px;
}
.current-user {
  display: flex;
  align-items: center;
  gap: 10px;
}
.small-avatar {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  overflow: hidden;
  background: #ddd;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-shrink: 0;
}
.small-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.current-user-name {
  font-size: 15px;
  font-weight: 600;
}
.switch-user {
  min-height: 40px;
  border: 0;
  background: none;
  padding: 8px;
  color: #777;
  font-size: 15px;
}
/* =====================================================
   Progress
   ===================================================== */
.progress-card {
  background: #222;
  color: white;
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 16px;
}
.progress-label {
  opacity: .7;
  font-size: 14px;
}
.progress-number {
  font-size: 36px;
  font-weight: 700;
  margin: 4px 0;
}
.progress-bar {
  height: 8px;
  background: #555;
  border-radius: 10px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: white;
  transition: .3s;
}
/* =====================================================
   Home Menu
   ===================================================== */
.menu-card {
  width: 100%;
  min-height: 76px;
  border: 0;
  background: white;
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 12px;
  display: flex;
  gap: 15px;
  align-items: center;
  text-align: left;
  box-shadow: 0 2px 8px rgba(0,0,0,.04);
}
.menu-icon {
  font-size: 27px;
  width: 42px;
  text-align: center;
  flex-shrink: 0;
}
.menu-title {
  font-size: 17px;
  font-weight: 600;
}
.menu-description {
  color: #888;
  font-size: 14px;
  margin-top: 3px;
}
/* =====================================================
   Point
   ===================================================== */
.point-card {
  background: white;
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.04);
}
.point-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
}
.point-name {
  font-size: 18px;
  font-weight: 700;
}
.point-id {
  color: #888;
  font-size: 13px;
  margin-top: 3px;
}
.point-location {
  color: #777;
  font-size: 14px;
  margin-top: 8px;
}
.point-last {
  margin-top: 10px;
  font-size: 13px;
  color: #666;
}
.status {
  padding: 5px 9px;
  border-radius: 20px;
  font-size: 12px;
  white-space: nowrap;
  height: max-content;
}
.status-normal {
  background: #e2f3e7;
  color: #176b35;
}
.status-today {
  background: #fff0b8;
  color: #745700;
}
.status-overdue {
  background: #ffe1e1;
  color: #a51d16;
}
.status-never {
  background: #ffe1e1;
  color: #a51d16;
}
.status-done {
  background: #dff5e5;
  color: #176b35;
}
.point-button {
  width: 100%;
  min-height: 48px;
  margin-top: 14px;
  padding: 11px;
  border: 0;
  border-radius: 12px;
  background: #222;
  color: white;
  font-size: 16px;
  font-weight: 600;
}
/* =====================================================
   Scan
   ===================================================== */
.scan-title {
  text-align: center;
  margin-top: 16px;
}
.scan-point {
  font-size: 19px;
  font-weight: 700;
  margin: 10px 0 24px;
}
.scan-option {
  width: 100%;
  min-height: 150px;
  border: 0;
  background: white;
  border-radius: 18px;
  padding: 24px 18px;
  margin-bottom: 14px;
  text-align: center;
  box-shadow: 0 2px 8px rgba(0,0,0,.05);
}
.scan-icon {
  font-size: 44px;
  line-height: 1;
  margin-bottom: 12px;
}
.scan-option-title {
  font-size: 19px;
  font-weight: 700;
}
.scan-option-description {
  color: #888;
  font-size: 14px;
  margin-top: 6px;
}
/* =====================================================
   Scanner
   ===================================================== */
.scanner-page {
  text-align: center;
}
.scanner-title {
  font-size: 23px;
  font-weight: 700;
  margin-top: 8px;
}
.scanner-description {
  color: #777;
  margin-top: 6px;
  margin-bottom: 18px;
}
.scanner-box {
  width: 100%;
  aspect-ratio: 1 / 1;
  background: #111;
  border-radius: 20px;
  overflow: hidden;
  position: relative;
  margin-bottom: 16px;
}
#qr-video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.scanner-frame {
  position: absolute;
  left: 15%;
  right: 15%;
  top: 15%;
  bottom: 15%;
  border: 3px solid white;
  border-radius: 18px;
  pointer-events: none;
  box-shadow: 0 0 0 999px rgba(0,0,0,.20);
}
.scanner-status {
  min-height: 25px;
  color: #666;
  margin-bottom: 12px;
}
.scanner-error {
  color: #a51d16;
}
/* =====================================================
   Bottom Navigation & Global Loading
   ===================================================== */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  min-height: 68px;
  padding-bottom: env(safe-area-inset-bottom);
  background: rgba(255,255,255,.97);
  border-top: 1px solid #ddd;
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 100;
  backdrop-filter: blur(12px);
}
.nav-btn {
  min-width: 72px;
  min-height: 58px;
  padding: 6px 8px;
  background: none;
  border: 0;
  color: #777;
  font-size: 12px;
  text-align: center;
}
.nav-icon {
  display: block;
  font-size: 22px;
  line-height: 1.1;
  margin-bottom: 2px;
}
#loadingOverlay {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: rgba(245, 246, 248, .88);
  -webkit-backdrop-filter: blur(5px);
  backdrop-filter: blur(5px);
  opacity: 1;
  visibility: visible;
  transition: opacity .18s ease, visibility .18s ease;
}
#loadingOverlay.is-hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.loading-panel {
  width: min(100%, 300px);
  padding: 28px 22px;
  border-radius: 20px;
  background: #fff;
  box-shadow: 0 8px 30px rgba(0,0,0,.12);
  text-align: center;
}
.loading-spinner {
  width: 54px;
  height: 54px;
  margin: 0 auto 18px;
  border: 5px solid #e5e7eb;
  border-top-color: #222;
  border-right-color: #555;
  border-radius: 50%;
  animation: loading-spin .78s linear infinite;
}
.loading-title {
  font-size: 18px;
  font-weight: 700;
  color: #202124;
}
.loading-message {
  margin-top: 7px;
  color: #777;
  font-size: 14px;
  line-height: 1.55;
}
.loading-dots::after {
  content: '';
  display: inline-block;
  width: 1.4em;
  text-align: left;
  animation: loading-dots 1.25s steps(4, end) infinite;
}
@keyframes loading-spin {
  to { transform: rotate(360deg); }
}
@keyframes loading-dots {
  0% { content: ''; }
  25% { content: '.'; }
  50% { content: '..'; }
  75%, 100% { content: '...'; }
}
</style>
</head>
<body>
<div id="app"></div>

<div id="loadingOverlay" role="status" aria-live="polite" aria-atomic="true">
  <div class="loading-panel">
    <div class="loading-spinner" aria-hidden="true"></div>
    <div class="loading-title">太陽能系統巡檢</div>
    <div id="loadingMessage" class="loading-message">正在連線並載入巡檢資料<span class="loading-dots"></span></div>
  </div>
</div>

<div id="bottomNav" class="bottom-nav" style="display:none">
  <button class="nav-btn" onclick="showHome()"><span class="nav-icon">⌂</span>首頁</button>
  <button class="nav-btn" onclick="showPoints()"><span class="nav-icon">✓</span>檢核</button>
  <button class="nav-btn" onclick="showHistory()"><span class="nav-icon">☷</span>記錄</button>
</div>

<script>
let inspectors = [];
let points = [];
let dashboard = [];
let todayInspections = [];
let currentInspector = null;
let currentPoint = null;
let checklist = [];
let results = {};
let currentMethod = '';
let openIssues = [];
let issueReviews = {};
let currentPhoto = null;

/* Scanner State */
let nfcReader = null;
let nfcAbortController = null;
let qrStream = null;
let qrDetector = null;
let qrScannerRunning = false;
let qrAnimationFrame = null;

/* Helper functions */
function esc(str) { return str ? String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])) : ''; }
function escJS(str) { return str ? String(str).replace(/'/g, "\\'") : ''; }
function app(html) { document.getElementById('app').innerHTML = html; }
function bottom(show) { document.getElementById('bottomNav').style.display = show ? 'flex' : 'none'; }
function showError(err) { alert('發生錯誤: ' + (err.message || err)); }

/* QR Code 掃描核心邏輯 (含 iOS 相容 Fallback) */
async function startQRScan() {
  app(`
  <div class="page scanner-page">
    <button class="back-btn" onclick="stopQRScan();showScanChoice()">← 返回</button>
    <div class="scanner-title">QR Code 掃描</div>
    <div class="scanner-description">將巡檢點的 QR Code 對準下方對焦框</div>
    <div class="scanner-box">
      <!-- iOS 必要屬性: playsinline 和 webkit-playsinline -->
      <video id="qr-video" autoplay playsinline webkit-playsinline muted></video>
      <div class="scanner-frame"></div>
    </div>
    <div id="scanner-status" class="scanner-status">啟動相機中...</div>
    <button class="secondary-btn" onclick="stopQRScan();showScanChoice()">取消掃描</button>
  </div>
  `);

  try {
    qrStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' }
    });
    const video = document.getElementById('qr-video');
    if (!video) return;

    video.srcObject = qrStream;
    await video.play();

    qrScannerRunning = true;

    // 檢查是否有原生 BarcodeDetector 支援 (大部分 Android Chrome 支援)
    if ('BarcodeDetector' in window) {
      try {
        qrDetector = new BarcodeDetector({ formats: ['qr_code'] });
      } catch (e) {
        qrDetector = null;
      }
    }

    const statusEl = document.getElementById('scanner-status');
    if (statusEl) statusEl.textContent = '尋找 QR Code 中...';

    // 建立 Canvas 用於 jsQR (iOS/Fallback 使用)
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    const scanFrame = async () => {
      if (!qrScannerRunning) return;

      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        let qrCodeValue = null;

        // 1. 優先使用原生 BarcodeDetector API
        if (qrDetector) {
          try {
            const barcodes = await qrDetector.detect(video);
            if (barcodes.length > 0) {
              qrCodeValue = barcodes[0].rawValue;
            }
          } catch (e) {
            console.warn('BarcodeDetector 執行失敗，切換至 jsQR', e);
            qrDetector = null; // 降級至 jsQR
          }
        }

        // 2. 如果無原生支援或失敗（如 iOS Safari），使用 jsQR 解析
        if (!qrCodeValue && !qrDetector && typeof jsQR !== 'undefined') {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const code = jsQR(imageData.data, imageData.width, imageData.height, {
            inversionAttempts: 'dontInvert'
          });
          if (code) {
            qrCodeValue = code.data;
          }
        }

        // 若成功解析出點位資料
        if (qrCodeValue) {
          stopQRScan();
          openScannedPoint(qrCodeValue, 'QR');
          return;
        }
      }

      qrAnimationFrame = requestAnimationFrame(scanFrame);
    };

    qrAnimationFrame = requestAnimationFrame(scanFrame);

  } catch (error) {
    showScannerError('無法存取相機：' + (error.message || error) + '。請確認已授予相機權限。');
  }
}

function stopQRScan() {
  qrScannerRunning = false;
  if (qrAnimationFrame) {
    cancelAnimationFrame(qrAnimationFrame);
    qrAnimationFrame = null;
  }
  if (qrStream) {
    qrStream.getTracks().forEach(track => track.stop());
    qrStream = null;
  }
}

function stopAllScanning() {
  stopQRScan();
  stopNFCScan();
}

function stopNFCScan() {
  if (nfcAbortController) {
    nfcAbortController.abort();
    nfcAbortController = null;
  }
  nfcReader = null;
}

function showScannerError(msg) {
  const status = document.getElementById('scanner-status');
  if (status) {
    status.innerHTML = `<span class="scanner-error">${esc(msg)}</span>`;
  } else {
    alert(msg);
  }
}

function openScannedPoint(pointID, method) {
  alert(`成功讀取點位 [${method}]：${pointID}`);
  // TODO: 繼續處理跳轉至該點位的檢核邏輯
}

/* 預設開啟首頁範例 (實際依你的需求運作) */
function showScanChoice() {
  app(`
  <div class="page">
    <div class="scan-title">
      <div class="title">掃描巡檢點位</div>
      <div class="scan-point">請選擇掃描方式</div>
    </div>
    <button class="scan-option" onclick="beginScan('QR')">
      <div class="scan-icon">▦</div>
      <div class="scan-option-title">QR Code</div>
      <div class="scan-option-description">使用手機相機掃描 QR Code</div>
    </button>
  </div>
  `);
}

async function beginScan(method) {
  stopAllScanning();
  if (method === 'QR') {
    await startQRScan();
  }
}

// 頁面初次載入
document.addEventListener("DOMContentLoaded", () => {
  document.getElementById('loadingOverlay').classList.add('is-hidden');
  showScanChoice();
});
</script>
</body>
</html>
